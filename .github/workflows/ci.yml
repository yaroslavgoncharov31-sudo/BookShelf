name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Run tests
        run: |
          xcodebuild test \
            -project BookShelf.xcodeproj \
            -scheme BookShelf \
            -destination 'platform=iOS Simulator,name=iPhone 16'
